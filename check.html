<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="pngegg.png">
    <title>Letter</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-image: url('bg.png');
            background-size: contain;
            background-repeat: repeat;
            background-position: center center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            height: 100vh;
        }
        #header{
            position:absolute;
            font-size:50px;
            top:3%;
            text-align: center;
        }
        h1{
            font-size: 60px;
            transform: translateY(-120px);
            color:violet;
            text-align: center;
        }

/* Scene */
.scene {
  perspective: 1000px;
}

.scene {
  perspective: 1000px;
  margin-top: 50px; /* moves the envelope down */
}

.envelope {
  position: relative;
  width: 420px;   /* wider envelope */
  height: 280px;  /* taller envelope */
  cursor: pointer;
  top:70px;
}

/* Back */
.back {
  position: absolute;
  inset: 0;
  background: purple;
  border-radius: 8px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  z-index: 1;
}

/* Letter */
.letter {
  position: absolute;
  width: 92%;       /* slightly wider */
  height: 95%;      /* slightly taller */
  background: purple;
  top: 5%;
  left: 4%;
  padding: 20px;
  box-sizing: border-box;
  border-radius: 6px;
  transition: transform 0.8s ease;
  z-index: 2;
  background-image: url('https://i.pinimg.com/736x/cf/e1/3d/cfe13d10950142d358444197a987084f.jpg');
  p{
    font-size:13.5px;
    display:none;
  }
}

/* Front */
.front {
  position: absolute;
  inset: 0;
  background: rgb(132, 9, 132);
  clip-path: polygon(
    0 0,
    50% 45%,   /* higher peak */
    100% 0,
    100% 100%,
    0 100%
  );
  border-radius: 8px;
  z-index: 100;
}

/* Flap */
.flap {
  position: absolute;
  inset: 0;
  background: rgb(160, 53, 160);
  clip-path: polygon(0 0, 50% 55%, 100% 0);
  transform-origin: top;
  transition: transform 0.8s ease;
  z-index: 4;
}

/* Open animation */
.envelope.open .flap {
  transform: rotateX(180deg);
}

.envelope.open .letter {
  animation-name: letter;
  animation-duration: 2s;
  animation-timing-function: ease-in;
  animation-delay: 2s;
  animation-iteration-count: 1;
  animation-direction: forward;
  animation-fill-mode: both;
  z-index: 100;
}
@keyframes letter {
    0%{
        transform: translateY(0%); /* slide slightly less for tall letter */
        visibility: hidden;
    }
    50%{
        transform: translateY(-80%); /* slide slightly less for tall letter */
        visibility: visible;
    }
    100%{
        transform:scale(2) translate(0, -50px);
        z-index: 110;
    }
}
.envelope.open .letter p {
  display:block
}

/* =========================
   Mobile responsiveness
   ========================= */

/* Small phones (max 480px) */
@media (max-width: 480px) {

  body {
    padding: 10px;
  }

  #header {
    font-size: 30px;
    top: 2%;
    padding: 0 10px;
  }

  .scene {
    margin-top: 20px;
  }

  .envelope {
    width: 300px;
    height: 200px;
    top: 40px;
  }

  .letter {
    padding: 12px;
  }

  .letter h3 {
    font-size: 14px;
  }

  .letter p {
    font-size: 11.5px;
    line-height: 1.4;
  }

  .envelope.open .letter {
    transform: translateY(-70%);
  }
  @keyframes letter {
    0%{
        transform: translateY(0%); /* slide slightly less for tall letter */
        visibility: hidden;
    }
    50%{
        transform: translateY(-80%); /* slide slightly less for tall letter */
        visibility: visible;
    }
    100%{
        transform:scale(1.5) translate(0, -50px);
        z-index: 110;
    }
}
}

/* Medium phones / small tablets (481px–768px) */
@media (max-width: 768px) {

  #header {
    font-size: 30px;
  }

  .envelope {
    width: 350px;
    height: 240px;
    top: 50px;
  }

  .letter p {
    font-size: 12.5px;
  }

  .envelope.open .letter {
    transform: translateY(-75%);
    height:120%;
  }
  @keyframes letter {
    0%{
        transform: translateY(0%); /* slide slightly less for tall letter */
        visibility: hidden;
    }
    50%{
        transform: translateY(-80%); /* slide slightly less for tall letter */
        visibility: visible;
    }
    100%{
        transform:scale(1.7) translate(0, -50px);
        z-index: 110;
    }
}
}

        </style>
    </head>
    <body>
        <h1>CLICK THE ENVELOPE BABY💌</h1>
        <div class="main">
        
        <div class="scene">
                <div class="envelope" id="envelope">
                    <div class="back"></div>
                    
                    <div class="letter">
                        <h3 style="margin-bottom:5px;">HI BABY😚</h3>
                        <p style="font-size: 20px; letter-spacing: 1.5px; padding-top:10px">
                            Hi baby HAPPY 1ST MONTHSARY, also I just want you to know that I love you and I'll always love you until time gets tired of moving forward🫶.
                        </p>
                    </div>
                    
                    <div class="front"></div>
                    <div class="flap"></div>
                </div>
            </div>
        </div>

        <script>
            const envelope = document.getElementById("envelope");

let opened = false;

envelope.addEventListener("pointerdown", function () {
  if (opened) return;

  opened = true;
  envelope.classList.add("open");
});
        </script>
    </body>
    </html>
